<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>杭州国庆旅行 · 交互地图</title>
  <link rel="stylesheet" href="../stylesheets/vendor/leaflet.css">
  <style>
    :root {
      --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #ffffff;
      --day2: #7c3aed; --day3: #ea580c; --day4: #2563eb; --day5: #16a34a; --day6: #dc2626;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont,
      "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); }
    #bar {
      position: fixed; inset: 0 0 auto 0; z-index: 1000; background: var(--bg);
      border-bottom: 1px solid var(--line); padding: 8px 12px;
      display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    }
    #bar a { color: var(--muted); text-decoration: none; font-size: 14px; white-space: nowrap; }
    #bar a:hover { color: var(--ink); }
    .tabs { display: flex; gap: 4px; }
    .tab {
      border: 1px solid var(--line); background: #f8fafc; color: var(--ink);
      padding: 5px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
    }
    .tab.on { background: var(--ink); border-color: var(--ink); color: #fff; }
    .days { display: flex; gap: 8px 12px; flex-wrap: wrap; font-size: 13px; }
    .days label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
    .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    #map { position: absolute; inset: 56px 0 0 0; }
    #legend {
      position: fixed; left: 12px; bottom: 18px; z-index: 1000; background: rgba(255,255,255,.94);
      border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12.5px;
      line-height: 1.9; box-shadow: 0 4px 14px rgba(15,23,42,.08);
    }
    #legend b { margin-right: 4px; }
    /* 底图切换 */
    #baseSwitch { display: flex; gap: 4px; align-items: center; }
    #baseSwitch .lab { font-size: 12px; color: var(--muted); margin-right: 2px; }
    #baseSwitch button {
      border: 1px solid var(--line); background: #f8fafc; color: var(--muted);
      padding: 4px 10px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
    }
    #baseSwitch button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
    #baseSwitch button:disabled { opacity: .4; cursor: not-allowed; }
    /* 点位弹窗 */
    .pop { font-size: 13px; line-height: 1.6; min-width: 190px; }
    .pop .pt { font-weight: 700; font-size: 14px; }
    .pop .meta { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
    .pop .links { display: flex; flex-direction: column; gap: 5px; }
    .pop .links a {
      display: inline-block; text-decoration: none; font-size: 12.5px;
      padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line);
      color: var(--ink); background: #f8fafc;
    }
    .pop .links a:hover { border-color: var(--ink); }
    @media (max-width: 640px) {
      #bar { inset: 0 0 auto 0; padding: 6px 10px; gap: 6px 10px; }
      #map { inset: 88px 0 0 0; }
      #legend { display: none; }
    }
  </style>
</head>
<body>
  <div id="bar">
    <a href="../">← 返回旅行计划</a>
    <div class="tabs" id="tabs"></div>
    <div class="days" id="days"></div>
    <div id="baseSwitch">
      <span class="lab">底图</span>
      <button data-base="vec">天地图·街道</button>
      <button data-base="img">天地图·影像</button>
      <button data-base="esri">Esri 总览</button>
    </div>
  </div>
  <div id="map"></div>
  <div id="legend">
    <div><span style="font-size:15px">✈️</span> 机场　<span style="font-size:15px">🏨</span> 住宿　<span style="font-size:15px">🍜</span> 餐饮</div>
    <div><span style="font-size:15px">🏛️</span> 景点　<span style="font-size:15px">🚌</span> 换乘　<span style="font-size:15px">🅿️</span> 停车换乘</div>
  </div>

  <script src="../javascripts/vendor/leaflet.js"></script>
  <script src="tianditu-config.js"></script>
  <script>
  const SCHEMES = [
    { id: "taxi",       label: "纯打车",   file: "taxi.geojson" },
    { id: "self-drive", label: "租车自驾", file: "self-drive.geojson" },
    { id: "transit",    label: "公共交通", file: "transit.geojson" }
  ];
  const DAY_COLORS = { 2: "#7c3aed", 3: "#ea580c", 4: "#2563eb", 5: "#16a34a", 6: "#dc2626" };
  const ICONS = { "机场": "✈️", "住宿": "🏨", "餐饮": "🍜", "餐饮与休息": "🍽️",
                  "景点": "🏛️", "换乘": "🚌", "停车换乘": "🅿️" };
  const TDT_KEY = (window.TIANDITU_KEY || "").trim();
  const TDT_SK = (window.TIANDITU_SK || "").trim();
  const TDT_SUBS = "01234567";
  const TDT_ATTR = '底图 &copy; <a href="https://www.tianditu.gov.cn/" target="_blank">天地图</a>';
  const ESRI_ATTR = 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom';

  const map = L.map("map", { zoomControl: true, attributionControl: true, maxZoom: 18 })
    .setView([30.27, 120.12], 12);

  /* ---------- 底图图层 ----------
     必须走 WMTS 标准端点（/vec_w/wmts?SERVICE=WMTS…）：DataServer REST 端点
     对带安全密钥(sk)的浏览器端应用一律返回 301020，WMTS 端点则正常。 */
  function tdtTile(code) {
    return L.tileLayer(
      "https://t{s}.tianditu.gov.cn/" + code + "_w/wmts"
      + "?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=" + code
      + "&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles"
      + "&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=" + TDT_KEY
      + (TDT_SK ? "&sk=" + TDT_SK : ""),
      { subdomains: TDT_SUBS, maxZoom: 18, maxNativeZoom: 18, attribution: TDT_ATTR }
    );
  }
  const baseLayers = {};
  if (TDT_KEY) {
    // vec 矢量街道 + cva 中文注记；img 卫星影像 + cia 影像注记
    baseLayers.vec = L.layerGroup([tdtTile("vec"), tdtTile("cva")]);
    baseLayers.img = L.layerGroup([tdtTile("img"), tdtTile("cia")]);
  }
  baseLayers.esri = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 18, maxNativeZoom: 17, attribution: ESRI_ATTR }
  );

  let activeBase = TDT_KEY ? "vec" : "esri";
  baseLayers[activeBase].addTo(map);

  function switchBase(name) {
    if (!baseLayers[name] || name === activeBase) return;
    map.removeLayer(baseLayers[activeBase]);
    activeBase = name;
    baseLayers[activeBase].addTo(map);
    document.querySelectorAll("#baseSwitch button").forEach(b =>
      b.classList.toggle("on", b.dataset.base === name));
  }
  document.querySelectorAll("#baseSwitch button").forEach(b => {
    b.classList.toggle("on", b.dataset.base === activeBase);
    if (!baseLayers[b.dataset.base]) b.disabled = true;
    b.onclick = () => switchBase(b.dataset.base);
  });
  if (!TDT_KEY) {
    // 未配置 key：提示但不阻断使用
    const tip = L.control({ position: "topright" });
    tip.onAdd = function () {
      const d = L.DomUtil.create("div");
      d.style.cssText = "margin:10px;padding:7px 11px;background:rgba(255,255,255,.95);"
        + "border:1px solid #e2e8f0;border-radius:8px;font-size:12px;color:#64748b;"
        + "box-shadow:0 2px 8px rgba(15,23,42,.08)";
      d.textContent = "未配置天地图 key，放大到街道级可能空白";
      return d;
    };
    tip.addTo(map);
  }

  /* ---------- WGS84 → GCJ-02（仅用于高德导航链接参数） ----------
     经典公开算法（eviltransform/gcoord）；地图点位与天地图仍使用 WGS84，不转换。 */
  const GCJ_A = 6378245.0, GCJ_EE = 0.00669342162296594323;
  function outOfChina(lng, lat) {
    return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271;
  }
  function tfLat(x, y) {
    let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
    r += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI)) * 2/3;
    r += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30)) * 2/3;
    return r;
  }
  function tfLng(x, y) {
    let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
    r += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI)) * 2/3;
    r += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI)) * 2/3;
    return r;
  }
  function wgs84ToGcj02(lng, lat) {
    if (outOfChina(lng, lat)) return [lng, lat];
    let dLat = tfLat(lng - 105, lat - 35);
    let dLng = tfLng(lng - 105, lat - 35);
    const radLat = lat / 180 * Math.PI;
    let magic = Math.sin(radLat);
    magic = 1 - GCJ_EE * magic * magic;
    const sqrtMagic = Math.sqrt(magic);
    dLat = dLat * 180 / ((GCJ_A * (1 - GCJ_EE)) / (magic * sqrtMagic) * Math.PI);
    dLng = dLng * 180 / (GCJ_A / sqrtMagic * Math.cos(radLat) * Math.PI);
    return [lng + dLng, lat + dLat];
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ---------- 点位弹窗（含高德跳转） ---------- */
  function pointPopup(feature, latlng) {
    const p = feature.properties || {};
    const lng = latlng.lng, lat = latlng.lat;
    const name = p.name || "";
    const en = encodeURIComponent(name);
    // 查看：高德 marker 接口原生支持 WGS84，直接传，位置精确
    const viewUrl = "https://uri.amap.com/marker?position=" + lng + "," + lat
      + "&name=" + en + "&coordinate=wgs84&src=hangzhou-trip&callnative=1";
    // 导航：导航接口无 coordinate 参数，先转 GCJ-02 再按高德默认坐标系传
    const g = wgs84ToGcj02(lng, lat);
    const navUrl = "https://uri.amap.com/navigation?to=" + g[0] + "," + g[1] + "," + en
      + "&mode=car&policy=1&src=hangzhou-trip&callnative=1";
    return L.popup().setContent(
      '<div class="pop">'
      + '<div class="pt">' + esc(name) + '</div>'
      + '<div class="meta">' + esc(p.type || "") + "　" + lat.toFixed(5) + ", " + lng.toFixed(5) + '</div>'
      + '<div class="links">'
      + '<a href="' + viewUrl + '" target="_blank" rel="noopener">📍 在高德地图查看</a>'
      + '<a href="' + navUrl + '" target="_blank" rel="noopener">🧭 从我的位置导航过去</a>'
      + '</div></div>'
    );
  }

  const cache = {};
  let current = null;          // 当前方案 L.layerGroup
  let dayGroups = {};          // 每天的连线图层

  function marker(feature, latlng) {
    const p = feature.properties || {};
    const color = p["marker-color"] || "#334155";
    const icon = L.divIcon({
      className: "",
      html: '<div style="background:' + color + ';width:26px;height:26px;border-radius:50% 50% 50% 0;'
          + 'transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);'
          + 'display:flex;align-items:center;justify-content:center">'
          + '<span style="transform:rotate(45deg);font-size:12px;line-height:1">'
          + (ICONS[p.type] || "📍") + '</span></div>',
      iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24]
    });
    return L.marker(latlng, { icon });
  }

  function buildScheme(data) {
    const group = L.layerGroup();
    dayGroups = {};
    data.features.forEach(f => {
      if (f.geometry.type === "Point") {
        const coords = f.geometry.coordinates;
        const layer = L.geoJSON(f, { pointToLayer: marker });
        layer.bindPopup(pointPopup(f, L.latLng(coords[1], coords[0])));
        layer.addTo(group);
      } else {
        const m = (f.properties.name || "").match(/(\d)\s*月(\d)\s*日/);
        const day = m ? Number(m[2]) : null;
        const line = L.geoJSON(f, {
          style: {
            color: f.properties.stroke || "#2563eb",
            weight: f.properties["stroke-width"] || 4,
            opacity: f.properties["stroke-opacity"] || 0.8
          }
        }).bindPopup("<b>" + (f.properties.name || "") + "</b><br>" + (f.properties.transport || ""));
        if (day) { dayGroups[day] = dayGroups[day] || L.layerGroup(); line.addTo(dayGroups[day]); }
        line.addTo(group);
      }
    });
    return group;
  }

  async function show(schemeId) {
    if (current) { map.removeLayer(current); }
    if (!cache[schemeId]) {
      const s = SCHEMES.find(x => x.id === schemeId);
      cache[schemeId] = await fetch(s.file).then(r => r.json());
    }
    current = buildScheme(cache[schemeId]);
    current.addTo(map);
    Object.values(dayGroups).forEach(g => g.addTo(map));
    map.fitBounds(L.geoJSON(cache[schemeId]).getBounds(), { padding: [36, 36] });
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.id === schemeId));
    history.replaceState(null, "", "#" + schemeId);
  }

  function toggleDay(day, on) {
    const g = dayGroups[day];
    if (!g) return;
    if (on && !map.hasLayer(g)) g.addTo(map);
    if (!on && map.hasLayer(g)) map.removeLayer(g);
  }

  // 构建选项卡与按天开关
  const tabsEl = document.getElementById("tabs");
  SCHEMES.forEach(s => {
    const b = document.createElement("button");
    b.className = "tab"; b.dataset.id = s.id; b.textContent = s.label;
    b.onclick = () => show(s.id);
    tabsEl.appendChild(b);
  });
  const daysEl = document.getElementById("days");
  Object.entries(DAY_COLORS).forEach(([d, c]) => {
    const lab = document.createElement("label");
    lab.innerHTML = '<input type="checkbox" checked data-day="' + d + '">'
      + '<span class="swatch" style="background:' + c + '"></span>10 月 ' + d + ' 日';
    lab.querySelector("input").onchange = e => toggleDay(Number(d), e.target.checked);
    daysEl.appendChild(lab);
  });

  const start = SCHEMES.some(s => s.id === location.hash.slice(1)) ? location.hash.slice(1) : "taxi";
  show(start);
  </script>
</body>
</html>
